<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" role="img" aria-labelledby="title desc"><title id="title">Categorías · autorreferencia</title><desc id="desc">padre_id apunta a categorias.id. Una raíz no tiene padre y una categoría puede tener varias hijas.</desc><style>text{font-family:system-ui,sans-serif;fill:#24483a}.entity-title{font-weight:750}.key{font-family:monospace;font-weight:700;fill:#42735b}.cardinality{font-weight:800;fill:#11634b}</style><rect width="540" height="720" rx="14" fill="#f7faf0"/><text x="270" y="28" font-size="20" class="entity-title" text-anchor="middle">Categorías · autorreferencia</text><path d="M480,400 H515 V130 H270 V310" fill="none" stroke="#245e4b" stroke-width="3"/><text x="330" y="179" font-size="25" class="cardinality" text-anchor="start">0..1 padre</text><text x="270" y="545" font-size="25" class="cardinality" text-anchor="middle">0..N hijas</text><g><rect x="60" y="313.0" width="420" height="154" rx="12" fill="white" stroke="#739c84" stroke-width="2"/><path d="M72,313.0 H468 Q480,313.0 480,325.0 V358.0 H60 V325.0 Q60,313.0 72,313.0" fill="#dceacb"/><text x="76" y="343.0" font-size="25" class="entity-title" text-anchor="start">categorias</text><text x="75" y="385.0" font-size="16" class="key" text-anchor="start">PK</text><text x="148" y="385.0" font-size="21" class="" text-anchor="start">id</text><text x="75" y="417.0" font-size="16" class="key" text-anchor="start"></text><text x="148" y="417.0" font-size="21" class="" text-anchor="start">nombre</text><text x="75" y="449.0" font-size="16" class="key" text-anchor="start">FK ?</text><text x="148" y="449.0" font-size="21" class="" text-anchor="start">padre_id → categorias.id</text></g><text x="270" y="690" font-size="17" class="" text-anchor="middle">PK primaria · FK foránea · UQ única</text><text x="270" y="714" font-size="17" class="" text-anchor="middle">0 opcional · 1 uno · N muchos</text></svg>