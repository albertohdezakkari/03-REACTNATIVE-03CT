name: Practicas completas C03
on:
  push:
    branches: [main]
    paths: ['control/practicas/**', '.github/workflows/practicas-completas.yml']
  pull_request:
    paths: ['control/practicas/**', '.github/workflows/practicas-completas.yml']
  workflow_dispatch:
jobs:
  practica:
    name: Caso ${{ matrix.caso }} con PostgreSQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        caso: ['01', '02', '03', '04', '05', '06']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '123456'
          POSTGRES_DB: practica_c${{ matrix.caso }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            control/practicas/caso-${{ matrix.caso }}/backend/package-lock.json
            control/practicas/caso-${{ matrix.caso }}/frontend/package-lock.json
      - name: Instalar proyectos independientes
        run: |
          npm ci --prefix control/practicas/caso-${{ matrix.caso }}/backend --no-audit --no-fund
          npm ci --prefix control/practicas/caso-${{ matrix.caso }}/frontend --no-audit --no-fund
      - name: Compilar backend y comprobar frontend
        run: |
          npm run build --prefix control/practicas/caso-${{ matrix.caso }}/backend
          cd control/practicas/caso-${{ matrix.caso }}/frontend
          ./node_modules/.bin/tsc --noEmit
      - name: API real y persistencia tras reinicio
        working-directory: control/practicas/caso-${{ matrix.caso }}/backend
        run: |
          cp .env.example .env
          node --env-file=.env dist/main.js > /tmp/practica-backend.log 2>&1 &
          practice_pid=$!
          trap 'kill "$practice_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/salud > /dev/null; then break; fi
            sleep 1
          done
          npm run test:api
          kill "$practice_pid"
          wait "$practice_pid" || true
          node --env-file=.env dist/main.js >> /tmp/practica-backend.log 2>&1 &
          practice_pid=$!
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/salud > /dev/null; then break; fi
            sleep 1
          done
          npm run test:persistencia
      - name: Diagnostico si falla
        if: failure()
        run: cat /tmp/practica-backend.log 2>/dev/null || true
